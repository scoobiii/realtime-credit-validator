name: CI/CD — Realtime Credit 
Validator# (conteúdo completo do 
ci.yml fornecido) on:
  push: branches: [main, develop] 
  pull_request:
    branches: [main] env: 
  GO_VERSION: "1.21" REGISTRY: 
  ghcr.io IMAGE_PREFIX: 
  ghcr.io/${{ 
  github.repository_owner 
  }}/realtime-credit-validator
jobs:
  # ───────────────────────────────────────── 
  # 1. Lint + Build + Unit Tests 
  # ─────────────────────────────────────────
  test: name: Lint, Build & Test 
    runs-on: ubuntu-latest steps:
      - uses: actions/checkout@v4 
      - name: Setup Go
        uses: actions/setup-go@v5 
        with:
          go-version: ${{ 
          env.GO_VERSION }} cache: 
          true
      - name: Install dependencies 
        run: go mod download
      - name: Lint uses: 
        golangci/golangci-lint-action@v4 
        with:
          version: latest - name: 
      Build gateway
        run: go build -o 
        /tmp/gateway ./src/gateway
      - name: Build wallet run: go 
        build -o /tmp/wallet 
        ./cmd/wallet
      - name: Build policy run: go 
        build -o /tmp/policy 
        ./cmd/policy
      - name: Unit tests run: go 
        test ./... -v -race 
        -coverprofile=coverage.out
      - name: Upload coverage 
        uses: 
        codecov/codecov-action@v4 
        with:
          file: coverage.out
  # ───────────────────────────────────────── 
  # 2. Integration Tests (com 
  # Docker) 
  # ─────────────────────────────────────────
  integration: name: Integration 
    Tests runs-on: ubuntu-latest 
    needs: test services:
      postgres: image: 
        postgres:15-alpine env:
          POSTGRES_USER: user 
          POSTGRES_PASSWORD: 
          password POSTGRES_DB: 
          wallet
        ports: - 5432:5432 
        options: >-
          --health-cmd pg_isready 
          --health-interval 5s 
          --health-timeout 5s 
          --health-retries 10
      redis: image: redis:alpine 
        ports:
          - 6379:6379 options: >- 
          --health-cmd "redis-cli 
          ping" --health-interval 
          5s --health-timeout 5s 
          --health-retries 10
      zookeeper: image: 
        confluentinc/cp-zookeeper:latest 
        env:
          ZOOKEEPER_CLIENT_PORT: 
          2181
        ports: - 2181:2181 kafka: 
        image: 
        confluentinc/cp-kafka:latest 
        env:
          KAFKA_BROKER_ID: 1 
          KAFKA_ZOOKEEPER_CONNECT: 
          zookeeper:2181 
          KAFKA_ADVERTISED_LISTENERS: 
          PLAINTEXT://localhost:9092 
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 
          1
        ports: - 9092:9092 steps: 
      - uses: actions/checkout@v4 
      - name: Setup Go
        uses: actions/setup-go@v5 
        with:
          go-version: ${{ 
          env.GO_VERSION }}
      - name: Build binaries run: 
        |
          go build -o wallet 
          ./cmd/wallet go build -o 
          policy ./cmd/policy go 
          build -o gateway 
          ./src/gateway
      - name: Start services env: 
          JWT_SECRET: 
          changeme-in-production 
          DB_URL: 
          postgres://user:password@localhost:5432/wallet?sslmode=disable 
          REDIS_ADDR: 
          localhost:6379 
          KAFKA_BROKERS: 
          localhost:9092
        run: | ./wallet > 
          wallet.log 2>&1 & 
          ./policy > policy.log 
          2>&1 & ./gateway > 
          gateway.log 2>&1 & sleep 
          5
      - name: Health check run: | 
          curl -f 
          http://localhost:8080/health 
          || (cat gateway.log && 
          exit 1) - name: Generate 
      JWT token
        run: | pip install pyjwt 
          python3 - <<'EOF' > 
          /tmp/token.txt import 
          jwt, time payload = {
            'user_id': 'testuser', 
            'scopes': 
            ['credit:write'], 
            'exp': 
            int(time.time()) + 
            86400, 'iat': 
            int(time.time()), 
            'iss': 
            'realtime-credit-validator', 
            'aud': 
            ['anatel-gateway']
          }
          print(jwt.encode(payload, 
          'changeme-in-production', 
          algorithm='HS256')) EOF
      - name: Curl smoke test run: 
        |
          RESULT=$(curl -s -w 
          "%{http_code}" \
            -X POST 
            http://localhost:8080/v1/credit 
            \ -H "Authorization: 
            Bearer $(cat 
            /tmp/token.txt)" \ -H 
            "Content-Type: 
            application/json" \ -d 
            '{"user_id":"testuser-1","amount":100,"idempotency_key":"ci-test-1","payment_method":"pix"}')
          echo "Response: $RESULT" 
          [[ "$RESULT" == *"200"* 
          ]] || exit 1
      - name: Install k6 run: | 
          sudo gpg 
          --no-default-keyring \
            --keyring 
            /usr/share/keyrings/k6-archive-keyring.gpg 
            \ --keyserver 
            hkp://keyserver.ubuntu.com:80 
            \ --recv-keys 
            C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb 
          [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] 
          \
            https://dl.k6.io/deb 
            stable main" | sudo 
            tee 
            /etc/apt/sources.list.d/k6.list
          sudo apt-get update && 
          sudo apt-get install -y 
          k6
      - name: k6 Anatel load test 
        env:
          JWT_SECRET: 
          changeme-in-production
        run: | k6 run \ -e 
            GATEWAY_URL=http://localhost:8080 
            \ -e TOKEN="$(cat 
            /tmp/token.txt)" \ 
            --vus 10 --duration 
            30s \ 
            --summary-export=anatel_latency_report.json 
            \ 
            tests/load/anatel-latency-test.js
      - name: Upload test report 
        uses: 
        actions/upload-artifact@v4 
        if: always() with:
          name: anatel-report 
          path: |
            anatel_latency_report.json 
            gateway.log
  # ───────────────────────────────────────── 
  # 3. Build & Push Docker Images 
  # ─────────────────────────────────────────
  docker: name: Build & Push 
    Images runs-on: ubuntu-latest 
    needs: integration if: 
    github.ref == 
    'refs/heads/main' permissions:
      contents: read packages: 
      write
    steps: - uses: 
      actions/checkout@v4 - name: 
      Login to GHCR
        uses: 
        docker/login-action@v3 
        with:
          registry: ${{ 
          env.REGISTRY }} 
          username: ${{ 
          github.actor }} 
          password: ${{ 
          secrets.GITHUB_TOKEN }}
      - name: Build & push gateway 
        uses: 
        docker/build-push-action@v5 
        with:
          context: . file: 
          src/gateway/Dockerfile 
          push: true tags: ${{ 
          env.IMAGE_PREFIX 
          }}-gateway:latest
      - name: Build & push wallet 
        uses: 
        docker/build-push-action@v5 
        with:
          context: . file: 
          src/wallet/Dockerfile 
          push: true tags: ${{ 
          env.IMAGE_PREFIX 
          }}-wallet:latest
      - name: Build & push policy 
        uses: 
        docker/build-push-action@v5 
        with:
          context: . file: 
          src/policy/Dockerfile 
          push: true tags: ${{ 
          env.IMAGE_PREFIX 
          }}-policy:latest
  # ───────────────────────────────────────── 
  # 4. Security Scan 
  # ─────────────────────────────────────────
  security: name: Security Scan 
    runs-on: ubuntu-latest needs: 
    docker if: github.ref == 
    'refs/heads/main' steps:
      - uses: actions/checkout@v4 
      - name: Run Trivy 
      vulnerability scan
        uses: 
        aquasecurity/trivy-action@master 
        with:
          image-ref: ${{ 
          env.IMAGE_PREFIX 
          }}-gateway:latest
          format: table exit-code: 
          1 severity: 
          CRITICAL,HIGH
