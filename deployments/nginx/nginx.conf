events {# (conteúdo completo do 
nginx.conf fornecido)
    worker_processes auto; 
    worker_connections 1024;
}
http {
    # ── Segurança 
    # ──────────────────────────────────────
    server_tokens off; add_header 
    X-Frame-Options DENY; 
    add_header 
    X-Content-Type-Options 
    nosniff; add_header 
    X-XSS-Protection "1; 
    mode=blocka add_header 
    Strict-Transport-Security 
    "max-age=31536000; 
    includeSubDomains" always;
    # ── Rate limit global (camada 
    # extra) ───────────────
    limit_req_zone 
    $binary_remote_addr 
    zone=api:10m rate=100r/s;
    # ── Logs 
    # ───────────────────────────────────────────
    log_format main '$remote_addr 
    - $remote_user [$time_local] '
                    '"$request" 
                    $status 
                    $body_bytes_sent 
                    ' 
                    '"$http_referer" 
                    "$http_user_agent" 
                    ' 
                    'rt=$request_time';
    access_log 
    /var/log/nginx/access.log 
    main; error_log 
    /var/log/nginx/error.log warn;
    # ── Upstream (gateway Go) 
    # ──────────────────────────
    upstream gateway { server 
        gateway:8080; keepalive 
        32;
    }
    # ── Redireciona HTTP → HTTPS 
    # ───────────────────────
    server { listen 80; 
        server_name _; return 301 
        https://$host$request_uri;
    }
    # ── HTTPS 
    # ──────────────────────────────────────────
    server { listen 443 ssl; http2 
        on; server_name _;
        # Certificados TLS
        ssl_certificate 
        /etc/nginx/certs/server.crt; 
        ssl_certificate_key 
        /etc/nginx/certs/server.key;
        # Protocolos e cifras 
        # seguras
        ssl_protocols TLSv1.2 
        TLSv1.3; ssl_ciphers 
        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384; 
        ssl_prefer_server_ciphers 
        off; ssl_session_cache 
        shared:SSL:10m; 
        ssl_session_timeout 1d;
        # ── Health check (sem 
        # rate limit) 
        # ──────────────
        location /health { 
            proxy_pass 
            http://gateway; 
            proxy_http_version 
            1.1; proxy_set_header 
            Connection "";
        }
        # ── API principal 
        # ──────────────────────────────
        location /v1/ { limit_req 
            zone=api burst=200 
            nodelay; 
            limit_req_status 429; 
            proxy_pass 
            http://gateway; 
            proxy_http_version 
            1.1; proxy_set_header 
            Connection ""; 
            proxy_set_header Host 
            $host; 
            proxy_set_header 
            X-Real-IP 
            $remote_addr; 
            proxy_set_header 
            X-Forwarded-For 
            $proxy_add_x_forwarded_for; 
            proxy_set_header 
            X-Forwarded-Proto 
            $scheme;
            # Timeouts alinhados 
            # com SLA Anatel (< 
            # 500ms)
            proxy_connect_timeout 
            5s; proxy_send_timeout 
            10s; 
            proxy_read_timeout 
            10s;
        }
    }
}
